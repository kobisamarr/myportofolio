{% extends "base.html" %}
{% block meta %}
    <title>Add Project - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <h1>Add New Projects</h1>
                <form method="post"
                      action="{% url 'main:create_project' %}"
                      class="project-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>  
                    {% endfor %}
                    <button type="submit" class="button">
                        Tambah Project
                    </button>
                    <a href="{% url 'main:show_projects' %}" class="button button-secondary">Batal</a>
                </form>
            </div>
        </section>
    </main>
<script>
    const form = document.getElementById("projectForm");
const message = document.getElementById("formMessage");

form.addEventListener("submit", async function (event) {
    // Mencegah submit HTML konvensional
    event.preventDefault();

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    const csrfToken = form.querySelector(
        '[name="csrfmiddlewaretoken"]'
    ).value;

    try {
        const response = await fetch("{% url 'api:project-list' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            message.textContent = JSON.stringify(result);
            return;
        }

        message.textContent = "Project berhasil ditambahkan!";
        form.reset();

        // Tidak ada reload atau redirect.
    } catch (error) {
        message.textContent = "Terjadi kesalahan saat mengirim data.";
    }
});
</script>
{% endblock content %}
